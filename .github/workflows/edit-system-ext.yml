      - name: Mount read-write on the COPY and remove the rule
        run: |
          set -eux
          mkdir -p mnt
          sudo mount -o loop system_ext_patched.img mnt
          # Edit OUTSIDE the mounted (tight) filesystem, on the runner's own disk,
          # then overwrite the existing inode in place with cp (no temp file on the image).
          cp mnt/etc/selinux/system_ext_sepolicy.cil cil_edit.tmp
          sed -i '/^(allow adbd adbroot (binder (call)))$/d' cil_edit.tmp
          sudo cp cil_edit.tmp mnt/etc/selinux/system_ext_sepolicy.cil
          echo "--- confirming it is gone ---"
          ! grep -q '^(allow adbd adbroot (binder (call)))$' mnt/etc/selinux/system_ext_sepolicy.cil
          sync
          sudo umount mnt
