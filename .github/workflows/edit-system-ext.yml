name: Remove adbd->adbroot binder rule from system_ext (EXT4)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag holding the system_ext image"
        default: system-ext-backup
      asset_name:
        description: "Asset filename"
        default: system_ext.img

# FIX: GITHUB_TOKEN is read-only by default -> 403 on `gh release create`
permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Install e2fsprogs
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs

      - name: Download system_ext image from this repo's release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          gh release download "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ inputs.asset_name }}" \
            --output system_ext.img
          ls -la system_ext.img
          file system_ext.img
          cp system_ext.img system_ext_patched.img

      - name: Mount read-only and show the rule before removal
        run: |
          set -eux
          mkdir -p mnt
          sudo mount -o loop,ro system_ext.img mnt
          test -f mnt/etc/selinux/system_ext_sepolicy.cil
          echo "--- line(s) to be removed ---"
          grep -n '^(allow adbd adbroot (binder (call)))$' mnt/etc/selinux/system_ext_sepolicy.cil
          df -h mnt
          sudo umount mnt

      - name: Mount read-write on the COPY and remove the rule (no-space-safe)
        run: |
          set -eux
          mkdir -p mnt
          sudo mount -o loop system_ext_patched.img mnt
          TARGET=mnt/etc/selinux/system_ext_sepolicy.cil
          cp "$TARGET" cil_edit.tmp
          sed -i '/^(allow adbd adbroot (binder (call)))$/d' cil_edit.tmp
          OLD_SIZE=$(stat -c%s "$TARGET")
          NEW_SIZE=$(stat -c%s cil_edit.tmp)
          echo "old=$OLD_SIZE new=$NEW_SIZE"
          # Overwrite existing blocks in place (no extra space needed), then shrink.
          sudo dd if=cil_edit.tmp of="$TARGET" bs=4096 conv=notrunc status=none
          sudo truncate -s "$NEW_SIZE" "$TARGET"
          echo "--- confirming it is gone ---"
          ! grep -q '^(allow adbd adbroot (binder (call)))$' "$TARGET"
          sync
          sudo umount mnt

      - name: Verify filesystem integrity after edit
        run: |
          set -eux
          sudo e2fsck -fn system_ext_patched.img
          ls -la system_ext_patched.img
          file system_ext_patched.img

      - name: Upload patched image to a new release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          gh release create "system-ext-patched-${{ github.run_id }}" \
            system_ext_patched.img \
            --repo "${{ github.repository }}" \
            --title "system_ext patched (adbroot rule removed)" \
            --notes "Built from run ${{ github.run_id }}"
            
