# Build the marble (POCO F5 / Redmi Note 12 Turbo) 6.6 kernel with FinaSU (default) or KernelSU Next
# and package the resulting Image as an AnyKernel3 zip. Pick the root with the "root" input.
#
# Lives in psychoela/marble-kernel (the build repo) as .github/workflows/build-6.6-ksunext-kleaf.yml.
# It builds the kernel source from psychoela/marble-kernel-x, branch cnb-6.6, which already has
# KernelSU Next built in (drivers/kernelsu + CONFIG_KSU=y), so no root injection step is needed here.
# Run it from Actions -> "Build marble 6.6 kernel (Kleaf, KernelSU Next built in)" -> Run workflow.
#
# STATUS: UNTESTED. Written from reading the repos, not from a successful run.
# Places most likely to need adjusting are marked with "CHECK".

name: Build marble 6.6 kernel (Kleaf, FinaSU / KernelSU Next)
run-name: Build marble 6.6 kernel (${{ inputs.root == 'finasu' && 'FinaSU' || 'KernelSU Next' }})

on:
  workflow_dispatch:
    inputs:
      root:
        description: "Root solution built into the kernel"
        type: choice
        options:
          - finasu
          - ksunext
        default: finasu
      finasu_ref:
        description: "FinaSU branch, tag or commit SHA (only used when root = finasu)"
        default: "master"
      clang:
        description: "Compiler: Kleaf's bundled Clang, or upstream LLVM Clang 22.1.8"
        type: choice
        options:
          - kleaf-default
          - llvm-22.1.8
        default: kleaf-default
      clang_url:
        description: "Download URL for the Clang tarball (only used when clang = llvm-22.1.8)"
        default: "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-Linux-X64.tar.xz"
      bazel_target:
        description: "Kleaf dist target that produces Image"
        default: "//vendor/xiaomi/sm8450-kernel:kernel_aarch64_dist"   # CHECK: confirm name
      modules_ref:
        description: "Branch of cupid-development modules/build repos"
        default: "lineage-24.0-6.6"
      lto:
        description: "Bazel --lto value (empty = Kleaf default, thin/none = faster)"
        default: ""

env:
  KP: kernel/platform/kernel-6.6
  # Kernel source (Evolution X cnb-6.6 + KernelSU Next commit). Pin a SHA here to build an exact commit.
  KERNEL_REPO: psychoela/marble-kernel-x
  KERNEL_BRANCH: cnb-6.6
  # Shown in /proc/version as "(PsychoAvy@github)"
  BUILD_USER: PsychoAvy
  BUILD_HOST: github

jobs:
  build:
    # 22.04 on purpose: 24.04 restricts unprivileged user namespaces, which breaks Bazel's sandbox.
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space and set up /mnt
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/work /mnt/bazel
          sudo chown -R "$USER" /mnt/work /mnt/bazel
          df -h / /mnt

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl zip unzip rsync python3 xz-utils lz4 bc

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name  "ci"
          git config --global user.email "ci@users.noreply.github.com"
          git config --global color.ui false

      - name: Build a minimal manifest (kernel platform + marble kernel repos only)
        working-directory: /mnt/work
        run: |
          # Evolution X's manifest carries the Kleaf/kernel-platform snippet for 6.6.
          git clone --depth 1 -b cnb https://github.com/Evolution-X/manifest evox-manifest

          mkdir -p mf/snippets
          cp evox-manifest/snippets/kernel-6.6.xml mf/snippets/kernel-6.6.xml
          cat > mf/default.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="aosp"   fetch="https://android.googlesource.com/" />
            <remote name="github" fetch="https://github.com/" />
            <default revision="main" remote="aosp" sync-j="4" />

            <include name="snippets/kernel-6.6.xml" />

            <!-- kernel source -->
            <project name="${{ env.KERNEL_REPO }}" path="kernel/platform/kernel-6.6/vendor/xiaomi/sm8450-kernel" remote="github" revision="${{ env.KERNEL_BRANCH }}" />

            <project name="Evolution-X-Devices/kernel_xiaomi_sm8450-devicetrees" path="kernel/platform/kernel-6.6/vendor/xiaomi/sm8450-devicetrees" remote="github" revision="cnb-6.6" />
            <project name="cupid-development/android_kernel_xiaomi_sm8450-modules-6.6" path="kernel/platform/kernel-6.6/vendor/xiaomi/sm8450-modules" remote="github" revision="${{ inputs.modules_ref }}" />
            <project name="cupid-development/android_kernel_xiaomi_sm8450-build-6.6" path="kernel/platform/kernel-6.6/vendor/xiaomi/sm8450-build" remote="github" revision="${{ inputs.modules_ref }}" />
          </manifest>
          EOF

          cd mf
          git init -q -b main
          git add -A
          git commit -q -m manifest

      - name: Sync sources
        working-directory: /mnt/work
        run: |
          mkdir -p ws && cd ws
          repo init --no-repo-verify -u file:///mnt/work/mf -b main -m default.xml
          repo sync -c -j4 --no-tags --no-clone-bundle --fail-fast
          ls "$KP"
          git -C "$KP/vendor/xiaomi/sm8450-kernel" log --oneline -2
          ls "$KP/vendor/xiaomi/sm8450-kernel/drivers/kernelsu" | head -3

      - name: Swap in FinaSU (replaces the built-in KernelSU Next driver)
        if: ${{ inputs.root == 'finasu' }}
        working-directory: /mnt/work/ws
        env:
          FINASU_REF: ${{ inputs.finasu_ref }}
        run: |
          # FinaSU (LyraVoid/FinaSU) keeps its driver in kernel/, like upstream KernelSU. Our kernel tree
          # already wires drivers/kernelsu into drivers/Makefile and drivers/Kconfig, so only the
          # directory contents change. kernel/include/uapi is a symlink to the repo's uapi/, so copy
          # with -L (dereference) while it still resolves inside the clone.
          KSU="$KP/vendor/xiaomi/sm8450-kernel/drivers/kernelsu"
          rm -rf /tmp/finasu && mkdir /tmp/finasu && cd /tmp/finasu
          git init -q
          git remote add origin https://github.com/LyraVoid/FinaSU
          git fetch --depth 1 origin "${FINASU_REF:-master}"
          git checkout -q FETCH_HEAD
          git log --oneline -1
          test -f kernel/Kbuild || { echo "kernel/Kbuild not found in FinaSU"; ls -la . kernel | head -40; exit 1; }
          cd /mnt/work/ws
          rm -rf "$KSU"; mkdir -p "$KSU"
          cp -rL /tmp/finasu/kernel/. "$KSU"/
          ls -la "$KSU" | head -40
          grep -n "config KSU\b" -A4 "$KSU/Kconfig" | head -12
          # Make sure the driver is switched on even if its Kconfig default is not y.
          DEF=$(find "$KP/vendor/xiaomi/sm8450-kernel/arch/arm64/configs" -name gki_defconfig | head -1)
          if [ -n "$DEF" ] && ! grep -q '^CONFIG_KSU=y' "$DEF" && ! grep -A6 'config KSU$' "$KSU/Kconfig" | grep -q 'default y'; then
            echo "CONFIG_KSU=y" >> "$DEF"; echo "added CONFIG_KSU=y to $DEF"
          fi

      - name: Fix KernelSU-Next include/uapi (symlink does not resolve inside Kleaf)
        if: ${{ inputs.root == 'ksunext' }}
        working-directory: /mnt/work/ws
        run: |
          # Kbuild already adds -I drivers/kernelsu/include, so "uapi/app_profile.h" must be at
          # drivers/kernelsu/include/uapi/. That entry is a symlink in the repo; it is either dangling
          # (target not vendored) or not followed by Kleaf's sandbox. Replace it with a real directory.
          KSU="$KP/vendor/xiaomi/sm8450-kernel/drivers/kernelsu"
          U="$KSU/include/uapi"
          ls -ld "$U"; readlink "$U" || true
          if [ -L "$U" ] && [ -f "$U/app_profile.h" ]; then
            echo "symlink resolves, replacing it with a real copy"
            cp -rL "$U" /tmp/uapi_copy
            rm -f "$U"; mv /tmp/uapi_copy "$U"
          elif [ ! -f "$U/app_profile.h" ]; then
            echo "uapi headers missing, fetching them from upstream KernelSU-Next"
            rm -rf "$U" /tmp/ksun
            # The vendored driver sources are newer than the v3.4.2 tag (they use PREINIT and
            # LOOKUP_SYMBOLS), so take the headers from the upstream default branch, not the tag.
            git clone --depth 1 https://github.com/KernelSU-Next/KernelSU-Next /tmp/ksun
            git -C /tmp/ksun log --oneline -1
            H=$(find /tmp/ksun -path '*/uapi/app_profile.h' | head -1)
            test -n "$H" || { echo "app_profile.h not found upstream"; find /tmp/ksun -maxdepth 3 -type d | head -40; exit 1; }
            mkdir -p "$U"
            cp -r "$(dirname "$H")"/. "$U"/
          fi
          test -f "$U/app_profile.h" && echo "OK: $U/app_profile.h present"
          # The headers must match the vendored .c files, so check the symbols dispatch.c needs.
          for sym in KSU_GET_INFO_FLAG_PREINIT KSU_LOOKUP_SYMBOLS_MAX KSU_IOCTL_LOOKUP_SYMBOLS ksu_lookup_symbols_cmd; do
            grep -rq "$sym" "$U" || { echo "MISMATCH: $sym not in uapi headers (wrong upstream commit)"; exit 1; }
          done
          ls -la "$U"

      - name: Hardcode build user/host in scripts/mkcompile_h
        working-directory: /mnt/work/ws
        run: |
          # Kleaf forces KBUILD_BUILD_USER=kleaf / HOST=build-host inside its sandbox, so env vars
          # and action_env are ignored. Patch the script that writes the version string instead.
          F="$KP/vendor/xiaomi/sm8450-kernel/scripts/mkcompile_h"
          sed -i -E "s|^([[:space:]]*)LINUX_COMPILE_BY=.*|\1LINUX_COMPILE_BY=${BUILD_USER}|; s|^([[:space:]]*)LINUX_COMPILE_HOST=.*|\1LINUX_COMPILE_HOST=${BUILD_HOST}|" "$F"
          grep -n 'LINUX_COMPILE_BY=\|LINUX_COMPILE_HOST=' "$F"
          grep -q "LINUX_COMPILE_BY=${BUILD_USER}" "$F" && grep -q "LINUX_COMPILE_HOST=${BUILD_HOST}" "$F" \
            || { echo "mkcompile_h patch did not apply"; cat "$F" | head -40; exit 1; }

      - name: Name the kernel release after the root (replaces "maybe-dirty")
        working-directory: /mnt/work/ws
        env:
          ROOT_TAG: ${{ inputs.root == 'finasu' && 'FinaSU' || 'KSUNext' }}
        run: |
          # Kleaf stamps unstamped builds with "-maybe-dirty". Replace that literal so the release becomes
          # e.g. 6.6.144-android15-8-FinaSU-4k. The "-androidNN-M" KMI prefix stays intact, and module
          # vermagic ignores the release string when CONFIG_MODVERSIONS is on.
          cd "$KP"
          FILES=$(grep -rIl "maybe-dirty" build/kernel vendor/xiaomi/sm8450-kernel/scripts 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "WARNING: 'maybe-dirty' literal not found, kernel release string left unchanged"
            exit 0
          fi
          echo "$FILES"
          sed -i "s/maybe-dirty/${ROOT_TAG}/g" $FILES
          grep -rn "$ROOT_TAG" $FILES | head -5

      - name: Download Clang 22.1.8 (upstream LLVM)
        if: ${{ inputs.clang == 'llvm-22.1.8' }}
        env:
          CLANG_URL: ${{ inputs.clang_url }}
        run: |
          mkdir -p /mnt/work/clang
          # Streamed straight into tar so the ~1 GB archive is never stored on disk.
          curl -fL --retry 3 --retry-delay 5 "$CLANG_URL" | tar -xJ --strip-components=1 -C /mnt/work/clang
          ls /mnt/work/clang
          /mnt/work/clang/bin/clang --version
          /mnt/work/clang/bin/clang --version | grep -q 'clang version 22\.1\.8' \
            || { echo "downloaded Clang is not 22.1.8"; exit 1; }
          for t in ld.lld llvm-ar llvm-nm llvm-objcopy llvm-strip llvm-objdump; do
            test -x "/mnt/work/clang/bin/$t" || { echo "missing $t in toolchain"; exit 1; }
          done

      - name: Build kernel with Kleaf
        working-directory: /mnt/work/ws
        run: |
          cd "$KP"
          LTO=""
          if [ -n "${{ inputs.lto }}" ]; then LTO="--lto=${{ inputs.lto }}"; fi

          # Set the build user/host. Done in two ways because Kleaf may not pass plain env vars into
          # its sandbox: exported from build.config.constants (CI checkout only, not committed)
          # and as Bazel action_env.  CHECK: see the "Show kernel version string" step for the result.
          printf '\nexport KBUILD_BUILD_USER=%s\nexport KBUILD_BUILD_HOST=%s\n' \
            "$BUILD_USER" "$BUILD_HOST" >> vendor/xiaomi/sm8450-kernel/build.config.constants
          LTO="$LTO --action_env=KBUILD_BUILD_USER=$BUILD_USER --action_env=KBUILD_BUILD_HOST=$BUILD_HOST"
          # Optional custom compiler: Kleaf's bazel wrapper takes an absolute path to a Clang toolchain.
          if [ "${{ inputs.clang }}" = "llvm-22.1.8" ]; then
            LTO="$LTO --user_clang_toolchain=/mnt/work/clang"
          fi
          # CHECK: some Kleaf versions want --config=local or extra flags on CI runners.
          tools/bazel --output_user_root=/mnt/bazel run $LTO \
            "${{ inputs.bazel_target }}" -- --dist_dir=/mnt/work/dist
          ls -la /mnt/work/dist | head -40

      - name: Show kernel version string
        run: |
          IMG=$(find /mnt/work/dist -maxdepth 2 -name Image -type f | head -1)
          strings "$IMG" | grep -m1 '^Linux version' || echo "version string not found in Image"
          echo "--- root markers in Image (root=${{ inputs.root }}):"
          strings "$IMG" | grep -i -m5 -E 'finasu|kernelsu' || echo "no KernelSU/FinaSU strings found"

      - name: Package AnyKernel3 zip
        run: |
          IMG=$(find /mnt/work/dist -maxdepth 2 -name Image -type f | head -1)
          test -n "$IMG" || { echo "Image not found in dist"; ls -R /mnt/work/dist | head -50; exit 1; }

          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 /mnt/work/ak3
          cd /mnt/work/ak3
          rm -rf .git .github README.md modules patch ramdisk
          cp "$IMG" Image

          cat > anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=marble 6.6 + ROOTLABEL
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=marble
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          # CHECK: partition layout. GKI + boot header v4 normally means "boot" holds the kernel.
          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

          if [ "${{ inputs.root }}" = "finasu" ]; then ROOT_NAME=FinaSU; else ROOT_NAME=KSUNext; fi
          sed -i "s/ROOTLABEL/$ROOT_NAME/" anykernel.sh
          DATE=$(date +%Y%m%d-%H%M)
          zip -r9 "/mnt/work/marble-6.6-$ROOT_NAME-$DATE.zip" . -x '*.git*'
          ls -la /mnt/work/*.zip

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: marble-6.6-${{ inputs.root }}
          path: /mnt/work/marble-6.6-*.zip
          if-no-files-found: error
