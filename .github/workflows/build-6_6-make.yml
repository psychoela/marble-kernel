name: Build marble 6.6 kernel (make + LLVM, NoMount + FinaSU or KernelSU-Next)

on:
  workflow_dispatch:
    inputs:
      root_choice:
        description: "Which root solution to build into the kernel"
        type: choice
        default: finasu
        options:
          - finasu
          - kernelsu-next
      clang_choice:
        description: "Which clang to build with"
        type: choice
        default: rom-clang-r510928
        options:
          - rom-clang-r510928
          - llvm-22.1.8
      with_nomount:
        description: "Build NoMount (maxsteeel/nomount) into the kernel"
        type: boolean
        default: true
      with_fgetpriority:
        description: "Build fgetpriority (aerath-stuff/fgetpriority, getpriority hiding helper for HMA) into the kernel"
        type: boolean
        default: true
      publish_release:
        description: "Also publish the zip as a GitHub Release (does not use artifact storage)"
        type: boolean
        default: true

env:
  # Your fork of Evolution-X kernel_xiaomi_sm8450, branch cnb-6.6 (Android 15 GKI 6.6).
  # KERNEL_SHA "" = tip of KERNEL_BRANCH (the commit is printed in the log). To pin, put a commit SHA here.
  KERNEL_REPO: https://github.com/psychoela/marble-kernel-x
  KERNEL_BRANCH: cnb-6.6
  KERNEL_SHA: ""
  # NoMount (maxsteeel/nomount), used when with_nomount is on. NOMOUNT_BRANCH "latest" = newest GitHub release
  # tag (auto-detected), falling back to the newest tag, then master. Put a fixed tag here to pin.
  NOMOUNT_REPO: https://github.com/maxsteeel/nomount
  NOMOUNT_BRANCH: latest
  NOMOUNT_SHA: ""
  # fgetpriority (aerath-stuff/fgetpriority), used when with_fgetpriority is on. Branch master.
  # FGP_SHA "" = tip of FGP_BRANCH (the commit is printed in the log). To pin, put a commit SHA here.
  FGP_REPO: https://github.com/aerath-stuff/fgetpriority
  FGP_BRANCH: master
  FGP_SHA: ""
  # FinaSU (LyraVoid/FinaSU, a KernelSU fork). FINASU_BRANCH "latest" = newest GitHub release tag.
  # The release APK of the SAME tag is used for the manager certificate, so kernel and manager match.
  FINASU_REPO: https://github.com/LyraVoid/FinaSU
  FINASU_BRANCH: latest
  FINASU_SHA: ""
  # KernelSU-Next, used when root_choice = kernelsu-next. "dev" = dev branch, or a release tag to pin.
  KSUN_REPO: https://github.com/KernelSU-Next/KernelSU-Next
  KSUN_BRANCH: dev
  KSUN_SHA: ""
  # The ROM's own compiler (clang_choice = rom-clang-r510928). config6_6.txt says the ROM kernel was built with
  # "Android (11368308, +pgo, +bolt, +lto, +mlgo, based on r510928) clang version 18.0.0".
  # That is the AOSP prebuilt directory clang-r510928, downloaded from android.googlesource.com.
  CLANG_DIR: clang-r510928
  CLANG_MAJOR: "18"
  # Release string. "" = auto: base version read from the kernel Makefile + LOCALVERSION_SUFFIX.
  EXPECTED_RELEASE: ""
  # Suffix of the ROM kernel release, as in `uname -r` on the phone. Evolution X 12.4 stock kernel is
  # 6.6.144-android15-8-g80cbc8e06240-4k. (The current phone kernel was g1db41da4638c-4k: either works,
  # modules ignore the release string because CONFIG_MODVERSIONS is on.)
  LOCALVERSION_SUFFIX: "-android15-8-g80cbc8e06240-4k"
  # Kernel base version running on the phone. If the built base differs, the log shows a WARNING.
  PHONE_BASE_VERSION: "6.6.144"
  # Ubuntu 24.04 ships pahole 1.25, which this kernel's BTF config needs (CONFIG_PAHOLE_VERSION=125).
  BUILD_IMAGE: ubuntu:24.04
  # Kernel-side support for the SUSFS LKM you already use: provides __stack_chk_guard.
  # Set to "0" if you do not use the SUSFS LKM.
  ENABLE_SUSFS_LKM: "1"
  # This build signs nothing with the ROM's module key. If GKI modules fail to load (dmesg shows
  # "module verification failed"), set this to "1" to turn off CONFIG_MODULE_SIG_PROTECT.
  MODULE_SIG_PROTECT_OFF: "0"

jobs:
  build:
    # GitHub only offers Ubuntu/Windows/macOS hosts. The host is only used to run
    # Docker; the whole kernel build happens inside a Debian container.
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write   # needed to create the GitHub Release
    steps:
      - name: Checkout (for config6_6.txt)
        uses: actions/checkout@v4

      - name: Resolve latest versions (FinaSU)
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_CHOICE: ${{ inputs.root_choice }}
          WITH_NOMOUNT: ${{ inputs.with_nomount }}
        run: |
          set -eu
          # latest_tag <owner/repo>: newest non-prerelease release; else newest release incl. prereleases;
          # else newest tag; else empty.
          latest_tag() {
            local r="$1" t=""
            t="$(gh release view --repo "$r" --json tagName -q .tagName 2>/dev/null || true)"
            [ -n "$t" ] || t="$(gh api "repos/$r/releases?per_page=1" -q '.[0].tag_name' 2>/dev/null || true)"
            [ -n "$t" ] || t="$(gh api "repos/$r/tags?per_page=1" -q '.[0].name' 2>/dev/null || true)"
            echo "$t"
          }
          if [ "$FINASU_BRANCH" = latest ] && [ "$ROOT_CHOICE" != kernelsu-next ]; then
            T="$(latest_tag LyraVoid/FinaSU)"
            [ -n "$T" ] || { echo "ERROR: could not find the latest FinaSU release"; exit 1; }
            echo "FINASU_BRANCH=$T" >> "$GITHUB_ENV"
          fi
          if [ "$WITH_NOMOUNT" = true ] && [ "$NOMOUNT_BRANCH" = latest ]; then
            T="$(latest_tag maxsteeel/nomount)"
            if [ -z "$T" ]; then echo "No NoMount release/tag found, using master"; T=master; fi
            echo "NOMOUNT_BRANCH=$T" >> "$GITHUB_ENV"
          fi
          grep -E '^(FINASU|NOMOUNT)_BRANCH=' "$GITHUB_ENV" || echo "nothing auto-resolved (pinned)"

      - name: Select root solution (FinaSU or KernelSU-Next)
        env:
          ROOT_CHOICE: ${{ inputs.root_choice }}
        run: |
          set -eu
          # ROOT_* = the root solution this build uses. ROOT_DIR is the folder name inside the kernel tree.
          # FINASU_BRANCH may already have been replaced by the newest tag in the step above.
          if [ "$ROOT_CHOICE" = kernelsu-next ]; then
            { echo "ROOT_NAME=KernelSU-Next"; echo "ROOT_DIR=KernelSU-Next"; echo "ROOT_REPO=$KSUN_REPO"
              echo "ROOT_REF=$KSUN_BRANCH"; echo "ROOT_SHA=$KSUN_SHA"; } >> "$GITHUB_ENV"
          else
            FB="$FINASU_BRANCH"
            if grep -q '^FINASU_BRANCH=' "$GITHUB_ENV"; then FB="$(grep '^FINASU_BRANCH=' "$GITHUB_ENV" | tail -n1 | cut -d= -f2)"; fi
            { echo "ROOT_NAME=FinaSU"; echo "ROOT_DIR=FinaSU"; echo "ROOT_REPO=$FINASU_REPO"
              echo "ROOT_REF=$FB"; echo "ROOT_SHA=$FINASU_SHA"; } >> "$GITHUB_ENV"
          fi
          echo "root solution: $ROOT_CHOICE"
          grep '^ROOT_' "$GITHUB_ENV"

      - name: Check that config6_6.txt is the phone's real 6.6 kernel config
        run: |
          set -eu
          test -s config6_6.txt || { echo "config6_6.txt missing in repo root"; exit 1; }
          head -n 4 config6_6.txt
          grep -q 'Linux/arm64 6\.6\.' config6_6.txt || { echo "config6_6.txt is not from a 6.6 kernel"; exit 1; }
          grep -q '^CONFIG_MODULES=y' config6_6.txt
          grep -q '^CONFIG_MODVERSIONS=y' config6_6.txt
          grep -q '^CONFIG_CFI_CLANG=y' config6_6.txt
          grep -q '^CONFIG_ARM64_4K_PAGES=y' config6_6.txt
          grep -q '^CONFIG_KPROBES=y' config6_6.txt || echo "WARNING: CONFIG_KPROBES is not =y in config6_6.txt"
          # NoMount v2 talks to userspace through the keyring API (add_key), so it needs CONFIG_KEYS
          grep -q '^CONFIG_KEYS=y' config6_6.txt || echo "WARNING: CONFIG_KEYS is not =y in config6_6.txt, NoMount v2 needs it"
          grep -E '^CONFIG_(LOCALVERSION|LTO_CLANG_[A-Z]+|LTO_NONE|TRIM_UNUSED_KSYMS|MODULE_SIG_PROTECT|DEBUG_INFO_BTF|KSU[A-Z_]*)=' config6_6.txt || true
          echo "config6_6.txt looks right"

      - name: No manager certificate pin (KernelSU-Next uses its default)
        if: ${{ inputs.root_choice == 'kernelsu-next' }}
        run: |
          set -eu
          # ci-build.sh sources finasu-sig.env and reads finasu-manager.hash: write empty values.
          echo 'FINASU_SIG_ARGS=""' > finasu-sig.env
          : > finasu-manager.hash
          cat finasu-sig.env

      - name: Pin the FinaSU manager certificate into the kernel
        if: ${{ inputs.root_choice != 'kernelsu-next' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          # FinaSU's Kbuild trusts the upstream KernelSU manager certificate by default, so the FinaSU
          # manager shows "Not installed". Its release APK certificate goes into the second signature slot.
          # Runs before "Free disk space" so apksigner (Android SDK) is still there for the cross-check.
          mkdir -p finasu-apk
          # Prefer the release that matches FINASU_BRANCH (a tag); fall back to the latest release (e.g. branch master)
          gh release download "$FINASU_BRANCH" --repo LyraVoid/FinaSU --pattern '*.apk' --dir finasu-apk --clobber \
            || gh release download --repo LyraVoid/FinaSU --pattern '*.apk' --dir finasu-apk --clobber
          ls -la finasu-apk
          APK="$(ls finasu-apk/*.apk | head -n1)"
          cat > apk_cert.py <<'PYEOF'
          #!/usr/bin/env python3
          """Print 'SIZE=0x.... HASH=<sha256>' of the first signing certificate of an APK (v2/v3 signing block)."""
          import hashlib, struct, sys

          def u32(b, o): return struct.unpack_from('<I', b, o)[0]
          def u64(b, o): return struct.unpack_from('<Q', b, o)[0]

          data = open(sys.argv[1], 'rb').read()
          eocd = data.rfind(b'PK\x05\x06')
          if eocd < 0:
              sys.exit("not a zip/APK")
          cd_off = u32(data, eocd + 16)
          if data[cd_off - 16:cd_off] != b'APK Sig Block 42':
              sys.exit("no APK signing block (APK is v1-signed only?)")
          blk_size = u64(data, cd_off - 24)
          pos = cd_off - blk_size - 8 + 8
          end = cd_off - 24
          pairs = {}
          while pos < end:
              ln = u64(data, pos)
              pid = u32(data, pos + 8)
              pairs[pid] = data[pos + 12:pos + 8 + ln]
              pos += 8 + ln
          val = pairs.get(0x7109871a) or pairs.get(0xf05368c0)   # v2, else v3
          if val is None:
              sys.exit("no v2/v3 signature in APK")
          o = 4                       # skip signers-sequence length
          o += 4                      # skip first signer length
          sd_len = u32(val, o); o += 4
          sd = val[o:o + sd_len]      # signed data: digests, certificates, ...
          d_len = u32(sd, 0)
          o2 = 4 + d_len
          o2 += 4                     # skip certificates-sequence length
          cert_len = u32(sd, o2); o2 += 4
          cert = sd[o2:o2 + cert_len]
          print("SIZE=0x%x HASH=%s" % (len(cert), hashlib.sha256(cert).hexdigest()))
          PYEOF
          OUT="$(python3 apk_cert.py "$APK")"
          echo "$OUT"
          SIZE="$(echo "$OUT" | sed -n 's/^SIZE=\([^ ]*\) .*/\1/p')"
          HASH="$(echo "$OUT" | sed -n 's/.* HASH=\(.*\)$/\1/p')"
          [ -n "$SIZE" ] && [ "${#HASH}" = 64 ]
          # cross-check with apksigner when the runner has it
          AS="$(ls /usr/local/lib/android/sdk/build-tools/*/apksigner 2>/dev/null | tail -n1 || true)"
          if [ -n "$AS" ]; then
            REF="$("$AS" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)"
            echo "apksigner SHA-256 = $REF"
            [ "$REF" = "$HASH" ]
          fi
          echo "FINASU_SIG_ARGS=\"KSU_EXPECTED_SIZE2=$SIZE KSU_EXPECTED_HASH2=$HASH KSU_SECOND_SIGNATURE_RELEASE=1\"" > finasu-sig.env
          echo "$HASH" > finasu-manager.hash
          cat finasu-sig.env

      - name: Free disk space and add swap (host)
        run: |
          set -eux
          # Full LTO + CFI link of vmlinux.o needs far more than the runner's ~7 GB RAM
          # (previous run: "Killed" / Error 137 = OOM). Free as much disk as possible and
          # turn it into a big swap file.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /usr/lib/jvm \
            /usr/local/julia* /usr/local/share/chromium /opt/microsoft /usr/lib/google-cloud-sdk \
            /usr/share/miniconda /opt/az /usr/local/aws-cli /usr/local/share/powershell || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          AVAIL_G="$(df --output=avail -BG /mnt | tail -1 | tr -dc '0-9')"
          # keep ~22 GB for clang, kernel tree and out/, rest goes to swap (8..40 GB)
          SWAP_G=$(( AVAIL_G - 22 ))
          [ "$SWAP_G" -gt 40 ] && SWAP_G=40
          [ "$SWAP_G" -lt 8 ] && SWAP_G=8
          echo "available ${AVAIL_G}G -> swap ${SWAP_G}G"
          sudo fallocate -l "${SWAP_G}G" /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          sudo sysctl vm.swappiness=100 || true
          df -h / /mnt
          free -g
          nproc

      - name: Download the ROM's clang (AOSP clang-r510928)
        if: ${{ inputs.clang_choice == 'rom-clang-r510928' }}
        run: |
          set -eux
          cat > fetch-clang.sh <<'EOF'
          #!/bin/bash
          # usage: fetch-clang.sh <repo-url> <clang-dir> <dest>
          # Older prebuilt clangs are removed from the branch tip over time. Find the last commit that still had it
          # (history of main-kernel, metadata only, a few seconds) and download ONLY that directory
          # as a tar.gz from Gitiles (+archive). This replaces the old "git checkout" of a blobless
          # clone, which died with "fatal: expected 'packfile'" (promisor fetch from googlesource).
          set -u
          BASE="$1"; DIR="$2"; DEST="$3"
          WORK="$(mktemp -d)"; cd "$WORK"

          fetch_archive() { # ref tries
            local ref="$1" tries="${2:-3}" i
            for i in $(seq 1 "$tries"); do
              rm -rf "$DEST"; mkdir -p "$DEST"
              echo "-- archive $ref (try $i/$tries)"
              if curl -fsSL --connect-timeout 30 --retry 3 --retry-all-errors "$BASE/+archive/$ref/$DIR.tar.gz" | tar -xzf - -C "$DEST" && [ -x "$DEST/bin/clang" ]; then
                echo "OK: $DIR from $ref"; return 0
              fi
              sleep $((i * 20))
            done
            rm -rf "$DEST"; mkdir -p "$DEST"
            return 1
          }

          found=0
          echo "== searching history of main-kernel"
          if timeout 1500 git clone -q --filter=blob:none --no-checkout --branch main-kernel "$BASE" hist; then
            del="$(timeout 1200 git -C hist log --diff-filter=D -1 --format=%H -- "$DIR")"
            add="$(timeout 1200 git -C hist log --diff-filter=A -1 --format=%H -- "$DIR")"
            echo "added in: ${add:-?}  deleted in: ${del:-?}"
            if [ -n "$del" ]; then
              parent="$(git -C hist rev-parse "$del^" 2>/dev/null || true)"
              [ -n "$parent" ] && fetch_archive "$parent" 3 && found=1
            fi
            if [ "$found" != 1 ] && [ -n "$add" ]; then fetch_archive "$add" 3 && found=1; fi
          fi

          if [ "$found" != 1 ]; then
            echo "== history failed, trying branch tips"
            for b in main-kernel master main mirror-goog-main-llvm-toolchain-source; do
              fetch_archive "refs/heads/$b" 1 && { found=1; break; }
            done
          fi

          [ "$found" = 1 ] || { echo "ERROR: could not find $DIR"; exit 1; }
          echo "OK: copied $DIR to $DEST"
          EOF
          mkdir -p "$HOME/clang"
          bash fetch-clang.sh https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 "$CLANG_DIR" "$HOME/clang"
          "$HOME/clang/bin/clang" --version
          "$HOME/clang/bin/clang" --version | grep -q "clang version $CLANG_MAJOR\." || { echo "Expected clang $CLANG_MAJOR but got something else. Check CLANG_DIR."; exit 1; }
          du -sh "$HOME/clang"

      - name: Download upstream LLVM 22.1.8
        if: ${{ inputs.clang_choice == 'llvm-22.1.8' }}
        run: |
          set -eux
          V=22.1.8
          mkdir -p "$HOME/clang"
          cd "$(mktemp -d)"
          ok=0
          for f in "LLVM-$V-Linux-X64.tar.xz" "clang+llvm-$V-x86_64-linux-gnu-ubuntu-22.04.tar.xz"; do
            echo "-- trying $f"
            if curl -fsSL --connect-timeout 30 --retry 3 --retry-all-errors -o clang.tar.xz \
                 "https://github.com/llvm/llvm-project/releases/download/llvmorg-$V/$f"; then
              ok=1; break
            fi
          done
          [ "$ok" = 1 ] || { echo "ERROR: no prebuilt LLVM $V Linux x86_64 tarball found on the release page"; exit 1; }
          tar -xJf clang.tar.xz -C "$HOME/clang" --strip-components=1
          "$HOME/clang/bin/clang" --version
          "$HOME/clang/bin/clang" --version | grep -q "clang version 22\.1\.8" || { echo "Expected clang 22.1.8"; exit 1; }
          for t in ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-readelf; do
            test -x "$HOME/clang/bin/$t" || { echo "MISSING $t"; exit 1; }
          done
          du -sh "$HOME/clang"

      - name: Fetch sources at pinned commits
        env:
          WITH_NOMOUNT: ${{ inputs.with_nomount }}
          WITH_FGP: ${{ inputs.with_fgetpriority }}
        run: |
          set -eux
          fetch_sha() { # url sha-or-branch dir
            git init -q "$3"
            git -C "$3" remote add origin "$1"
            git -C "$3" fetch -q --depth 1 origin "$2"
            git -C "$3" checkout -q FETCH_HEAD
          }
          # kernel: pinned SHA if KERNEL_SHA is set, otherwise tip of KERNEL_BRANCH
          fetch_sha "$KERNEL_REPO" "${KERNEL_SHA:-$KERNEL_BRANCH}" kernel
          if [ "$WITH_NOMOUNT" = true ]; then
            fetch_sha "$NOMOUNT_REPO" "${NOMOUNT_SHA:-$NOMOUNT_BRANCH}" nomount
            git -C nomount log -1 --format='nomount %H %s'
            ls -la nomount/kernel/src
          fi
          if [ "$WITH_FGP" = true ]; then
            fetch_sha "$FGP_REPO" "${FGP_SHA:-$FGP_BRANCH}" fgetpriority
            git -C fgetpriority log -1 --format='fgetpriority %H %s'
            find fgetpriority -path fgetpriority/.git -prune -o -type f -print | head -50
          fi
          # Root solution (FinaSU or KernelSU-Next): full history, its version number is computed from commit count.
          # ROOT_REF can be a branch or a release tag.
          git clone -q --branch "$ROOT_REF" "$ROOT_REPO" rootsu
          if [ -n "$ROOT_SHA" ]; then git -C rootsu checkout -q "$ROOT_SHA"; fi
          git -C rootsu log -1 --format="$ROOT_NAME %H %s"
          test -f rootsu/kernel/Kconfig || { echo "ERROR: rootsu/kernel/Kconfig not found ($ROOT_NAME $ROOT_REF)"; exit 1; }
          ls -la rootsu/kernel
          grep -nE '^config KSU' rootsu/kernel/Kconfig || echo "WARNING: no 'config KSU' symbol in $ROOT_NAME kernel/Kconfig"
          git -C kernel log -1 --format='kernel %H %s'
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' kernel/Makefile | head -3

      - name: Integrate NoMount and the root solution (FinaSU or KernelSU-Next)
        env:
          WITH_NOMOUNT: ${{ inputs.with_nomount }}
          WITH_FGP: ${{ inputs.with_fgetpriority }}
        run: |
          set -eux
          K="$PWD/kernel"

          add_source() { # file, line to insert before the last "endmenu"
            if ! grep -qF "$2" "$1"; then
              awk -v line="$2" '/^endmenu/{l=NR} {a[NR]=$0} END{for(i=1;i<=NR;i++){if(i==l)print line; print a[i]}}' "$1" > "$1.tmp"
              mv "$1.tmp" "$1"
            fi
          }

          # The 6.6 tree already ships a vendored KernelSU-Next copy in drivers/kernelsu. Show it, then start clean.
          ls -ld "$K/drivers/kernelsu" "$K/FinaSU" "$K/KernelSU-Next" 2>&1 || true
          rm -rf "$K/drivers/kernelsu" "$K/FinaSU" "$K/KernelSU-Next"

          # NoMount: copy its kernel source into fs/nomount and hook it into fs/Makefile and fs/Kconfig
          if [ "$WITH_NOMOUNT" = true ]; then
            ls -ld "$K/fs/nomount" 2>&1 || true
            rm -rf "$K/fs/nomount"
            mkdir -p "$K/fs/nomount"
            cp -f nomount/kernel/src/* "$K/fs/nomount/"
            grep -q nomount "$K/fs/Makefile" || printf '\nobj-$(CONFIG_NOMOUNT) += nomount/\n' >> "$K/fs/Makefile"
            add_source "$K/fs/Kconfig" 'source "fs/nomount/Kconfig"'
            grep -n nomount "$K/fs/Makefile" "$K/fs/Kconfig"
          fi

          # fgetpriority: copy its kernel source into drivers/fgetpriority, hook it into drivers/Makefile
          # and drivers/Kconfig, and remember its config symbol so ci-build.sh can switch it on.
          : > fgp.config
          if [ "$WITH_FGP" = true ]; then
            SRC=fgetpriority; [ -d fgetpriority/kernel ] && SRC=fgetpriority/kernel
            rm -rf "$K/drivers/fgetpriority"
            mkdir -p "$K/drivers/fgetpriority"
            cp -a "$SRC"/. "$K/drivers/fgetpriority/"
            rm -rf "$K/drivers/fgetpriority/.git"
            ls -la "$K/drivers/fgetpriority"
            test -f "$K/drivers/fgetpriority/Kconfig" || { echo "ERROR: no Kconfig in $SRC (fgetpriority $FGP_BRANCH), see the file list above"; exit 1; }
            test -f "$K/drivers/fgetpriority/Makefile" || test -f "$K/drivers/fgetpriority/Kbuild" || { echo "ERROR: no Makefile/Kbuild in $SRC"; exit 1; }
            SYM="$(grep -m1 -E '^config ' "$K/drivers/fgetpriority/Kconfig" | awk '{print $2}')"
            [ -n "$SYM" ] || { echo "ERROR: no 'config' symbol in fgetpriority Kconfig"; exit 1; }
            echo "CONFIG_$SYM=y" > fgp.config
            grep -q 'fgetpriority' "$K/drivers/Makefile" || printf '\nobj-$(CONFIG_%s) += fgetpriority/\n' "$SYM" >> "$K/drivers/Makefile"
            add_source "$K/drivers/Kconfig" 'source "drivers/fgetpriority/Kconfig"'
            grep -n fgetpriority "$K/drivers/Makefile" "$K/drivers/Kconfig"
            cat fgp.config
          fi

          # Root solution (FinaSU or KernelSU-Next): keep it a git repo inside the tree,
          # symlink like KernelSU's setup.sh does
          mv rootsu "$K/$ROOT_DIR"
          ln -sfn "../$ROOT_DIR/kernel" "$K/drivers/kernelsu"
          grep -q kernelsu "$K/drivers/Makefile" || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$K/drivers/Makefile"
          add_source "$K/drivers/Kconfig" 'source "drivers/kernelsu/Kconfig"'

          grep -n kernelsu "$K/drivers/Makefile" "$K/drivers/Kconfig"

      - name: Silence compiler warnings inside the root solution only
        run: |
          set -eux
          K="$PWD/kernel"
          # This kernel's build treats every compiler warning as fatal ("error, forbidden warning: ...").
          # FinaSU compiles with at least one warning on this setup (unused variable
          # syscall_redirects_pinned_module in hook/syscall_hook_manager.c), so the build died there.
          # -w is applied to the root solution directory only (FinaSU or KernelSU-Next);
          # the rest of the kernel is unchanged.
          grep -q 'FINASU_NO_WARN' "$K/$ROOT_DIR/kernel/Kbuild" || \
            printf '\n# FINASU_NO_WARN\nccflags-y += -w\nsubdir-ccflags-y += -w\n' >> "$K/$ROOT_DIR/kernel/Kbuild"
          tail -5 "$K/$ROOT_DIR/kernel/Kbuild"

      - name: Provide __stack_chk_guard for the SUSFS LKM
        if: env.ENABLE_SUSFS_LKM == '1'
        run: |
          set -eux
          K="$PWD/kernel"
          # This kernel uses CONFIG_STACKPROTECTOR_PER_TASK, so it has no global __stack_chk_guard.
          # The prebuilt susfs_guard_lkm-*.ko still references it (load.log: "unresolved
          # __stack_chk_guard", init_module ENOENT). A plain global variable fixes that. It adds one
          # symbol only: no struct or existing symbol changes, so vendor modules are unaffected.
          cat > "$K/kernel/susfs_lkm_support.c" <<'CEOF'
          // SPDX-License-Identifier: GPL-2.0
          /*
           * Global stack protector guard for prebuilt LKMs that were compiled with the global
           * guard model. The kernel itself keeps using its per-task canary and never reads this.
           */
          #include <linux/compiler.h>
          #include <linux/export.h>

          unsigned long __stack_chk_guard __used = 0x5f5ec0de5f5ec0deUL;
          EXPORT_SYMBOL(__stack_chk_guard);
          CEOF
          grep -q 'susfs_lkm_support' "$K/kernel/Makefile" || printf '\nobj-y += susfs_lkm_support.o\n' >> "$K/kernel/Makefile"
          tail -3 "$K/kernel/Makefile"

      - name: Show which root solution is being built
        continue-on-error: true
        run: |
          set -eu
          cd "kernel/$ROOT_DIR"
          echo "$ROOT_NAME commit = $(git rev-parse HEAD)"
          echo "$ROOT_NAME describe = $(git describe --tags --always 2>/dev/null || true)"
          echo "$ROOT_NAME commit count = $(git rev-list --count HEAD)"
          # the hook manager uses kprobes: warn early if the kernel config has none
          grep -q '^CONFIG_KPROBES=y' "$GITHUB_WORKSPACE/config6_6.txt" || echo "WARNING: CONFIG_KPROBES is not =y in config6_6.txt, FinaSU hooks need it"

      - name: Write in-container build script
        run: |
          cat > ci-build.sh <<'EOF'
          #!/bin/bash
          # Runs INSIDE the Debian container. /w = workspace, /clang = Android clang
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            flex bison bc cpio libssl-dev libelf-dev xz-utils python3 binutils \
            make gcc g++ git ca-certificates curl python-is-python3 perl \
            libxml2 libzstd1 zlib1g libtinfo6 ccache dwarves zstd
          head -2 /etc/os-release
          # repo is owned by another uid than root: let git (used by Kbuild) work anyway
          git config --global --add safe.directory '*'
          export PATH=/clang/bin:$PATH
          clang --version | sed -n 1p
          # ccache wraps clang. The cache dir is in the workspace so the workflow can save/restore it.
          # compiler_check is a fixed string (the clang version line) so a fresh toolchain download still hits.
          export CCACHE_DIR=/w/.ccache CCACHE_BASEDIR=/w/kernel CCACHE_MAXSIZE=3G
          export CCACHE_COMPILERCHECK="string:$(clang --version | head -n1)"
          export CCACHE_SLOPPINESS=include_file_mtime,include_file_ctime,time_macros
          mkdir -p /opt/ccache-bin "$CCACHE_DIR"
          ln -sf "$(command -v ccache)" /opt/ccache-bin/clang
          export PATH=/opt/ccache-bin:$PATH
          ccache -z || true
          trap 'ccache -s || true' EXIT
          cd /w/kernel
          # Detect the kernel base version from the source and build the expected release string
          KVER="$(head -n 10 Makefile | awk '/^VERSION *=/{v=$3} /^PATCHLEVEL *=/{p=$3} /^SUBLEVEL *=/{s=$3} END{print v"."p"."s}')"
          EXPECTED_RELEASE="${EXPECTED_RELEASE:-$KVER$LOCALVERSION_SUFFIX}"
          echo "kernel source version = $KVER, expected release = $EXPECTED_RELEASE"
          if [ -n "${PHONE_BASE_VERSION:-}" ] && [ "$KVER" != "$PHONE_BASE_VERSION" ]; then
            echo "WARNING: source is $KVER but the phone runs $PHONE_BASE_VERSION. Vendor modules in the ROM may not load; keep your old Image to flash back."
          fi
          MK="ARCH=arm64 LLVM=1 LLVM_IAS=1 HOSTCC=gcc HOSTCXX=g++ O=out LOCALVERSION="

          mkdir -p out
          cp ../config6_6.txt out/.config
          printf 'CONFIG_KSU=y\n' >> out/.config
          if [ -s /w/fgp.config ]; then cat /w/fgp.config >> out/.config; fi
          if [ "${WITH_NOMOUNT:-false}" = true ]; then printf 'CONFIG_NOMOUNT=y\n' >> out/.config; fi
          # Use tracepoint hook mode when this KernelSU fork offers it (ignored otherwise)
          if grep -rqE 'config KSU_TRACEPOINT_HOOK' "/w/kernel/$ROOT_DIR/kernel" --include='Kconfig*'; then
            echo 'CONFIG_KSU_TRACEPOINT_HOOK=y' >> out/.config
          fi
          # TCP BBR + Westwood (+ fq qdisc, which BBR works best with). Selectable at runtime; the default stays cubic.
          printf 'CONFIG_TCP_CONG_ADVANCED=y\nCONFIG_TCP_CONG_BBR=y\nCONFIG_TCP_CONG_WESTWOOD=y\nCONFIG_NET_SCH_FQ=y\n' >> out/.config
          # fq_codel + cake qdiscs, TTL/HL iptables target (hotspot TTL), WireGuard VPN
          printf 'CONFIG_NET_SCH_FQ_CODEL=y\nCONFIG_NET_SCH_CAKE=y\nCONFIG_NETFILTER_XT_TARGET_HL=y\nCONFIG_WIREGUARD=y\n' >> out/.config
          grep -rnE 'config KSU_[A-Z0-9_]*HOOK' "/w/kernel/$ROOT_DIR/kernel" --include='Kconfig*' || true

          # No Bazel here, so there is no abi_symbollist.raw to trim against. Exporting every symbol is a
          # superset of what the ROM's modules need, so they still load.
          sed -i 's/^CONFIG_TRIM_UNUSED_KSYMS=y/# CONFIG_TRIM_UNUSED_KSYMS is not set/; s/^CONFIG_UNUSED_KSYMS_WHITELIST=.*/CONFIG_UNUSED_KSYMS_WHITELIST=""/' out/.config
          # Optional: this build generates its own module signing key, so the ROM's prebuilt modules are not
          # signed by it. Turn this on if GKI modules refuse to load (dmesg: "module verification failed").
          if [ "${MODULE_SIG_PROTECT_OFF:-0}" = 1 ]; then
            sed -i 's/^CONFIG_MODULE_SIG_PROTECT=y/# CONFIG_MODULE_SIG_PROTECT is not set/' out/.config
          fi
          # newer clang adds new warnings; do not let CONFIG_WERROR turn them into errors
          sed -i 's/^CONFIG_WERROR=y/# CONFIG_WERROR is not set/' out/.config
          sed -i "s/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=\"$LOCALVERSION_SUFFIX\"/; s/^CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/" out/.config
          make $MK olddefconfig
          grep -E '^CONFIG_(TCP_CONG_BBR|TCP_CONG_WESTWOOD|NET_SCH_FQ|NET_SCH_FQ_CODEL|NET_SCH_CAKE|NETFILTER_XT_TARGET_HL|WIREGUARD|KSU|NOMOUNT|KEYS|LTO_NONE|CFI_CLANG|SHADOW_CALL_STACK|MODVERSIONS|DEBUG_INFO_BTF|TRIM_UNUSED_KSYMS|MODULE_SIG_PROTECT|MODULES|MODULE_UNLOAD|MODULE_FORCE_LOAD|KALLSYMS|KALLSYMS_ALL|KPROBES|LOCALVERSION|DEBUG_INFO|DEBUG_INFO_BTF)=' out/.config || true
          # These must survive olddefconfig, otherwise vendor modules will not load
          grep -q '^CONFIG_KSU=y' out/.config
          if [ "${WITH_NOMOUNT:-false}" = true ]; then grep -q '^CONFIG_NOMOUNT=y' out/.config; fi
          if [ -s /w/fgp.config ]; then grep -qxF "$(cat /w/fgp.config)" out/.config || { echo "ERROR: $(cat /w/fgp.config) did not survive olddefconfig (missing dependency?)"; exit 1; }; fi
          grep -q '^CONFIG_MODULES=y' out/.config
          grep -q '^CONFIG_TCP_CONG_BBR=y' out/.config
          grep -q '^CONFIG_TCP_CONG_WESTWOOD=y' out/.config
          grep -q '^CONFIG_NET_SCH_FQ=y' out/.config
          grep -q '^CONFIG_NET_SCH_FQ_CODEL=y' out/.config
          grep -q '^CONFIG_NET_SCH_CAKE=y' out/.config
          grep -q '^CONFIG_NETFILTER_XT_TARGET_HL=y' out/.config
          grep -q '^CONFIG_WIREGUARD=y' out/.config
          grep -E '^CONFIG_KSU' out/.config
          grep -q '^CONFIG_CFI_CLANG=y' out/.config
          diff <(grep -E '^(CONFIG_|# CONFIG_)' ../config6_6.txt | sort) <(grep -E '^(CONFIG_|# CONFIG_)' out/.config | sort) > ../config.diff || true
          echo "--- config differences against the phone config:"
          cat ../config.diff

          # memory monitor (shows in the log how close the LTO link gets to the limit)
          ( while sleep 120; do echo "[mem] $(free -m | awk 'NR==2{print "ram used "$3"/"$2" MB"} NR==3{print "swap used "$3"/"$2" MB"}' | tr '\n' ' ')"; done ) &
          MONPID=$!
          . /w/finasu-sig.env
          echo "manager certificate args: $FINASU_SIG_ARGS"
          if ! make -j"$(nproc)" $MK $FINASU_SIG_ARGS KBUILD_BUILD_USER=PsychoAvy KBUILD_BUILD_HOST=github Image > ../build.log 2>&1; then
            echo "BUILD FAILED, errors:"
            grep -nE 'error|Error' ../build.log | head -60 || true
            echo "last 60 lines:"; tail -60 ../build.log
            exit 1
          fi
          kill $MONPID 2>/dev/null || true
          tail -5 ../build.log

          cd out
          rel="$(cat include/config/kernel.release)"
          echo "kernel.release = $rel"
          # the real release (and so the module vermagic) must be unchanged
          [ "$rel" = "$EXPECTED_RELEASE" ]
          strings -n 8 arch/arm64/boot/Image | grep -m1 'Linux version 6.6'
          strings arch/arm64/boot/Image | grep -qx "$EXPECTED_RELEASE SMP preempt mod_unload modversions aarch64" \
            || echo "WARNING: vermagic string differs from \"$EXPECTED_RELEASE SMP preempt mod_unload modversions aarch64\", check the strings in the Image"
          if [ "${WITH_NOMOUNT:-false}" = true ]; then echo "nomount symbols: $(grep -cE ' [tT] nm_' System.map)"; fi
          if [ -s /w/finasu-manager.hash ]; then
            if strings arch/arm64/boot/Image | grep -qF "$(cat /w/finasu-manager.hash)"; then
              echo "FinaSU manager certificate hash is inside the Image: yes"
            else
              echo "WARNING: FinaSU manager certificate hash NOT found in the Image, the manager may still show Not installed"
            fi
          else
            echo "$ROOT_NAME: no certificate pin, the default manager certificate is used (install the normal manager APK)"
          fi
          echo "ksu symbols: $(grep -ciE 'ksu' System.map)"
          if [ "${ENABLE_SUSFS_LKM:-0}" = 1 ]; then
            grep -E ' [A-Za-z] __stack_chk_guard$' System.map || echo "WARNING: __stack_chk_guard is not in System.map, the SUSFS LKM will fail to load"
          fi
          echo "susfs symbols (informational, 0 is expected: SUSFS comes from the LKM module you installed): $(grep -ciE 'susfs' System.map)"
          grep -iE 'FinaSU|KernelSU|Hook mode' ../../build.log | head -20 || true
          ls -la arch/arm64/boot/Image

          EOF
          chmod +x ci-build.sh

      - name: Restore ccache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-marble66-${{ github.run_id }}
          restore-keys: |
            ccache-marble66-

      - name: Configure, build and verify (inside Ubuntu container)
        env:
          CLANG_CHOICE: ${{ inputs.clang_choice }}
          WITH_NOMOUNT: ${{ inputs.with_nomount }}
        run: |
          set -eux
          IMG="$BUILD_IMAGE"
          echo "build image: $IMG"
          docker run --rm \
            -e EXPECTED_RELEASE="$EXPECTED_RELEASE" \
            -e LOCALVERSION_SUFFIX="$LOCALVERSION_SUFFIX" \
            -e PHONE_BASE_VERSION="$PHONE_BASE_VERSION" \
            -e ROOT_NAME="$ROOT_NAME" \
            -e ROOT_DIR="$ROOT_DIR" \
            -e ENABLE_SUSFS_LKM="$ENABLE_SUSFS_LKM" \
            -e WITH_NOMOUNT="$WITH_NOMOUNT" \
            -e MODULE_SIG_PROTECT_OFF="$MODULE_SIG_PROTECT_OFF" \
            -v "$PWD":/w \
            -v "$HOME/clang":/clang:ro \
            "$IMG" bash /w/ci-build.sh

      - name: Save ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-marble66-${{ github.run_id }}

      - name: Package AnyKernel3 zip
        env:
          ROOT_CHOICE: ${{ inputs.root_choice }}
          WITH_NOMOUNT: ${{ inputs.with_nomount }}
          WITH_FGP: ${{ inputs.with_fgetpriority }}
        run: |
          set -eux
          NM=""; [ "$WITH_NOMOUNT" = true ] && NM="-nomount"
          [ "$WITH_FGP" = true ] && NM="$NM-fgp"
          if [ "$ROOT_CHOICE" = kernelsu-next ]; then ZIP_NAME="marble-6.6-ksunext$NM.zip"; else ZIP_NAME="marble-6.6-finasu$NM.zip"; fi
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          test -f kernel/out/arch/arm64/boot/Image
          git clone -q --depth 1 https://github.com/osm0sis/AnyKernel3 ak3
          cd ak3
          rm -rf .git .github README.md patch ramdisk
          mkdir -p ramdisk patch
          cat > anykernel.sh <<'EOF'
          ### AnyKernel3 - POCO F5 (marble) GKI 6.6 kernel + ROOTLABEL
          properties() { '
          kernel.string=marble 6.6 GKI | ROOTLABEL | clang built
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=marble
          device.name2=marblein
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          # GKI boot image: only the kernel is replaced, the rest of boot.img stays as it is
          split_boot;
          flash_boot;
          EOF
          LABEL="$ROOT_NAME"; [ "$WITH_NOMOUNT" = true ] && LABEL="NoMount + $ROOT_NAME"
          [ "$WITH_FGP" = true ] && LABEL="$LABEL + fgetpriority"
          sed -i "s/ROOTLABEL/$LABEL/g" anykernel.sh
          cp ../kernel/out/arch/arm64/boot/Image Image
          zip -qr9 "../$ZIP_NAME" .
          cd ..
          cp kernel/out/arch/arm64/boot/Image Image
          sha256sum "$ZIP_NAME" Image | tee SHA256SUMS

      - name: Publish GitHub Release
        if: success() && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          CLANG_CHOICE: ${{ inputs.clang_choice }}
          WITH_NOMOUNT: ${{ inputs.with_nomount }}
          WITH_FGP: ${{ inputs.with_fgetpriority }}
        run: |
          set -eu
          TAG="build-66-${{ github.run_number }}"
          RUN_NO="${{ github.run_number }}"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          CFG=kernel/out/.config
          ZIP="$ZIP_NAME"
          REL="$(cat kernel/out/include/config/kernel.release)"
          KVER="$(head -n 10 kernel/Makefile | awk '/^VERSION *=/{v=$3} /^PATCHLEVEL *=/{p=$3} /^SUBLEVEL *=/{s=$3} END{print v"."p"."s}')"
          KSHA="$(git -C kernel rev-parse HEAD 2>/dev/null || echo unknown)"
          KSHORT="$(echo "$KSHA" | cut -c1-7)"
          KSUBJ="$(git -C kernel log -1 --format=%s 2>/dev/null || true)"
          RSHA="$(git -C "kernel/$ROOT_DIR" rev-parse HEAD 2>/dev/null || echo unknown)"
          RSHORT="$(echo "$RSHA" | cut -c1-7)"
          RDESC="$(git -C "kernel/$ROOT_DIR" describe --tags --always 2>/dev/null || echo unknown)"
          RCOUNT="$(git -C "kernel/$ROOT_DIR" rev-list --count HEAD 2>/dev/null || echo '?')"
          ROOT_URL="${ROOT_REPO%.git}"
          CLANG_VER="$("$HOME/clang/bin/clang" --version 2>/dev/null | head -n1 || true)"
          [ -n "$CLANG_VER" ] || CLANG_VER="$CLANG_CHOICE"
          if   grep -q '^CONFIG_LTO_CLANG_FULL=y' "$CFG"; then LTO="Full LTO"
          elif grep -q '^CONFIG_LTO_CLANG_THIN=y' "$CFG"; then LTO="ThinLTO"
          else LTO="LTO off"; fi
          if grep -q '^CONFIG_CFI_CLANG=y' "$CFG"; then CFI="CFI on"; else CFI="CFI off"; fi
          KSU_OPTS="$(grep -E '^CONFIG_KSU[A-Z0-9_]*=y' "$CFG" | sed 's/^CONFIG_//; s/=y$//' | paste -sd, - | sed 's/,/, /g')"
          if [ -s finasu-manager.hash ]; then
            CERT_TXT="pinned, manager cert SHA-256 \`$(cat finasu-manager.hash)\` (use the FinaSU manager of tag \`$ROOT_REF\`)"
          else
            CERT_TXT="default manager certificate (install the normal KernelSU-Next manager, try the non-spoofed APK first)"
          fi
          sz() { numfmt --to=iec --suffix=B "$(stat -c%s "$1")"; }
          {
            echo "# marble ${KVER} · ${ROOT_NAME}"
            echo
            echo "\`${REL}\`"
            echo
            echo "- **Root:** ${ROOT_NAME} \`${RDESC}\` ([\`${RSHORT}\`](${ROOT_URL}/commit/${RSHA}), ${RCOUNT} commits) · ref \`${ROOT_REF}\`"
            if [ "$WITH_NOMOUNT" = true ]; then
              NSHA="$(git -C nomount rev-parse HEAD 2>/dev/null || echo unknown)"
              echo "- **NoMount:** built in (install the NoMount module after flashing) · ref \`${NOMOUNT_BRANCH}\` · [\`$(echo "$NSHA" | cut -c1-7)\`](${NOMOUNT_REPO}/commit/${NSHA})"
            fi
            if [ "$WITH_FGP" = true ]; then
              FSHA="$(git -C fgetpriority rev-parse HEAD 2>/dev/null || echo unknown)"
              echo "- **fgetpriority:** built in · ref \`${FGP_BRANCH}\` · [\`$(echo "$FSHA" | cut -c1-7)\`](${FGP_REPO}/commit/${FSHA})"
            fi
            echo "- **Clang:** \`${CLANG_VER}\` · ${LTO} · ${CFI} · choice \`${CLANG_CHOICE}\`"
            echo "- **Commit:** [\`${KSHORT}\`](${KERNEL_REPO}/commit/${KSHA}) · ${KSUBJ}"
            echo "- **Base:** [psychoela/marble-kernel-x](${KERNEL_REPO}), branch \`${KERNEL_BRANCH}\`"
            echo
            echo "> Back up boot first. Flash with a kernel flasher app or in recovery."
            echo
            echo "## Files"
            echo
            echo "- \`${ZIP}\` ($(sz "$ZIP")): AnyKernel3 zip, flash this"
            echo "- \`Image\` ($(sz Image)): raw kernel Image"
            echo "- \`SHA256SUMS\`"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > release-notes.md
          cat release-notes.md
          gh release create "$TAG" "$ZIP" Image SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "marble ${KVER} ${ROOT_NAME}$( [ "$WITH_NOMOUNT" = true ] && echo ' + NoMount')$( [ "$WITH_FGP" = true ] && echo ' + fgetpriority')" \
            --notes-file release-notes.md \
            --prerelease

      - name: Upload result
        if: always()
        continue-on-error: true   # a full artifact quota must not fail a build that already succeeded
        uses: actions/upload-artifact@v4
        with:
          name: marble-6.6-kernel
          retention-days: 1
          if-no-files-found: warn
          path: |
            marble-6.6-*.zip
            Image
            SHA256SUMS
            release-notes.md
            build.log
            config.diff

